<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#g)"/>
  <!-- Segitiga play presisi: tinggi (9 ke 23) simetris terhadap sumbu
       y=16 pusat lingkaran; lebar (13 ke 23) digeser dikit ke kanan dari
       titik tengah x=16 -- koreksi optik standar supaya segitiga play
       terlihat center (bukan condong kiri) di mata manusia. -->
  <polygon points="13,9 13,23 23,16" fill="#0A0D13"/>
</svg>
